<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="css/valentine.css" />
  </head>
  <body>
    <div id="valentineQuestion"><b>Will you be my valentine?</b></div>
    <div class="button-container">
      <button class="answerButton" onclick="location.href='lastpage.html'">Yes</button>
      <button class="answerButton" id="noButton">No, I don't wanna o(╥﹏╥)o</button>
    </div>
    <br />
    <img src="bear.gif" alt="bear jumping with flowers" class="responsive" />

    <script>
      document.getElementById("noButton").addEventListener("click", function () {
        var yesButton = document.querySelector('button[onclick*="lastpage.html"]');
        var currentFontSize = parseInt(window.getComputedStyle(yesButton).fontSize);
        yesButton.style.fontSize = currentFontSize + 10 + "px"; // Increase font size by 10px
      });
    </script>
  </body>
</html>
